<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F-Jugend Turnier-Timer Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes pulse-red {
            0%, 100% { background-color: #ef4444; }
            50% { background-color: #7f1d1d; }
        }
        .animate-pulse-red {
            animation: pulse-red 2s infinite;
        }
    </style>
</head>
<body class="bg-slate-900 text-white font-sans min-h-screen flex flex-col justify-between p-6">

    <!-- Top Bar / KPI -->
    <div class="flex justify-between items-center bg-slate-800 p-6 rounded-2xl shadow-lg border border-slate-700">
        <div class="cursor-pointer group" onclick="incrementRound()" title="Klicken zum Erhöhen">
            <p class="text-xs text-slate-400 uppercase tracking-widest font-semibold group-hover:text-emerald-400 transition">Runde (Klick +1)</p>
            <div class="flex items-center gap-3 mt-1">
                <span id="roundLabel" class="text-4xl font-bold text-emerald-400 transition group-active:scale-95">Runde 1</span>
            </div>
        </div>
        <div class="text-right">
            <p class="text-xs text-slate-400 uppercase tracking-widest font-semibold">Status</p>
            <p id="systemStatus" class="text-2xl font-bold text-white mt-1">Bereit</p>
        </div>
    </div>

    <!-- Main Timer Display -->
    <div id="timerContainer" class="flex flex-col items-center justify-center my-auto py-12 transition-all duration-500 rounded-3xl">
        <div id="timeDisplay" class="text-[12rem] font-black tracking-tighter tabular-nums leading-none drop-shadow-md">
            10:00
        </div>
        <div id="statusMessage" class="text-2xl font-medium text-emerald-400 mt-4 tracking-wide uppercase text-center px-4">
            Bereit für den Anpfiff
        </div>
    </div>

    <!-- Control Center -->
    <div class="bg-slate-800 p-6 rounded-2xl shadow-lg border border-slate-700 flex flex-col lg:flex-row justify-between items-center gap-6">
        <div class="flex gap-4">
            <button id="startStopBtn" onclick="toggleTimer()" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold px-10 py-5 rounded-xl text-2xl shadow-lg transition-all active:scale-95">
                START
            </button>
            <button onclick="resetTimer()" class="bg-slate-700 hover:bg-slate-600 text-white font-semibold px-6 py-5 rounded-xl text-xl transition-all active:scale-95">
                Reset
            </button>
        </div>

        <!-- Settings -->
        <div class="flex flex-wrap items-center justify-center gap-6 bg-slate-900/50 p-4 rounded-2xl border border-slate-700/50">
            <div class="flex flex-col gap-1">
                <label class="text-xs font-bold text-slate-500 uppercase">Spielzeit (Min)</label>
                <input type="number" id="durationInput" value="10" class="w-20 bg-slate-800 text-white font-bold px-3 py-2 rounded-lg border border-slate-600 focus:border-emerald-500 outline-none">
            </div>
            <div class="flex flex-col gap-1">
                <label class="text-xs font-bold text-slate-500 uppercase">Hype ab Minute X</label>
                <input type="number" id="hypeInput" value="9" class="w-20 bg-slate-800 text-white font-bold px-3 py-2 rounded-lg border border-slate-600 focus:border-emerald-500 outline-none">
            </div>
            <button onclick="applySettings()" class="bg-sky-600 hover:bg-sky-500 text-white font-bold px-6 py-2 h-10 self-end rounded-lg transition shadow-md active:scale-95">
                Übernehmen
            </button>
        </div>
    </div>

    <audio id="alertBeep" src="https://actions.google.com/sounds/v1/alarms/digital_watch_alarm_long.ogg"></audio>

    <script>
        let timer = null;
        let initialSeconds = 480;
        let totalSeconds = 480;
        let isRunning = false;
        let currentRound = 1;

        const timeDisplay = document.getElementById('timeDisplay');
        const startStopBtn = document.getElementById('startStopBtn');
        const statusMessage = document.getElementById('statusMessage');
        const timerContainer = document.getElementById('timerContainer');
        const alertBeep = document.getElementById('alertBeep');
        const durationInput = document.getElementById('durationInput');
        const hypeInput = document.getElementById('hypeInput');
        const systemStatus = document.getElementById('systemStatus');

        function updateDisplay() {
            let minutes = Math.floor(totalSeconds / 60);
            let seconds = totalSeconds % 60;
            timeDisplay.innerText = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

            let hypeStartMinute = parseInt(hypeInput.value);
            // Hype startet, wenn die bereits vergangene Zeit >= hypeStartMinute ist
            let elapsedSeconds = initialSeconds - totalSeconds;
            let hypeStartSecondsThreshold = hypeStartMinute * 60;

            if (totalSeconds > 0 && elapsedSeconds >= hypeStartSecondsThreshold) {
                timerContainer.classList.add('animate-pulse-red');
                statusMessage.innerText = "🚀 AUDIO STARTEN! (Major Tom)";
                statusMessage.className = "text-2xl font-black text-white mt-4 tracking-widest uppercase text-center";
                
                // Sound-Logik: Nur beim exakten Erreichen der Hype-Sekunde starten und nach 2 Sek stoppen
                if (elapsedSeconds === hypeStartSecondsThreshold) {
                    alertBeep.play();
                    setTimeout(() => {
                        alertBeep.pause();
                        alertBeep.currentTime = 0;
                    }, 2000);
                }
            } else if (totalSeconds === 0) {
                timerContainer.classList.remove('animate-pulse-red');
                timerContainer.classList.add('bg-red-600');
                statusMessage.innerText = "🏁 SCHLUSSPFIFF";
                systemStatus.innerText = "Beendet";
            } else {
                timerContainer.classList.remove('animate-pulse-red', 'bg-red-600');
                statusMessage.innerText = "Spiel läuft...";
                statusMessage.className = "text-2xl font-medium text-emerald-400 mt-4 tracking-wide uppercase text-center";
                systemStatus.innerText = "Aktiv";
            }
        }

        function toggleTimer() {
            if (isRunning) {
                clearInterval(timer);
                startStopBtn.innerText = "START";
                startStopBtn.className = "bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold px-10 py-5 rounded-xl text-2xl shadow-lg transition-all active:scale-95";
                isRunning = false;
            } else {
                timer = setInterval(() => {
                    if (totalSeconds > 0) {
                        totalSeconds--;
                        updateDisplay();
                    } else {
                        clearInterval(timer);
                        isRunning = false;
                        startStopBtn.innerText = "START";
                    }
                }, 1000);
                startStopBtn.innerText = "PAUSE";
                startStopBtn.className = "bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-10 py-5 rounded-xl text-2xl shadow-lg transition-all active:scale-95";
                isRunning = true;
            }
        }

        function resetTimer() {
            clearInterval(timer);
            isRunning = false;
            totalSeconds = initialSeconds;
            startStopBtn.innerText = "START";
            startStopBtn.className = "bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold px-10 py-5 rounded-xl text-2xl shadow-lg transition-all active:scale-95";
            systemStatus.innerText = "Bereit";
            updateDisplay();
        }

        function applySettings() {
            initialSeconds = parseInt(durationInput.value) * 60;
            resetTimer();
        }

        function incrementRound() {
            currentRound++;
            document.getElementById('roundLabel').innerText = "Runde " + currentRound;
            // Kleiner optischer Feedback-Effekt beim Klicken
            const lbl = document.getElementById('roundLabel');
            lbl.classList.add('text-white');
            setTimeout(() => lbl.classList.remove('text-white'), 200);
        }

        updateDisplay();
    </script>
</body>
</html>
